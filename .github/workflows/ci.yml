name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject.toml promises ("<4.0,>=3.10") and the README
        # repeats; everything above it is where cro-dl must still work. A version
        # that goes red here is a version to stop claiming - either fix it or
        # raise the floor in pyproject.toml, the README and this list together.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install cro-dl the way a user does
        # `[test]` is what a bare `pip install .` lacks: pytest and PyYAML, which
        # tests/test_ci.py reads the workflow with. The system libraries are for
        # a dependency that has to be built from source on a fresh Python - lxml
        # needs them when its wheel for the runner's version is not out yet.
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev
          python -m pip install ".[test]"
      - name: Tests
        run: python -m pytest tests/ -q

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff format --check crodl/ tests/
      - run: uv run ruff check crodl/ tests/
      - run: uv run ty check crodl/
      - run: uv run pyright crodl/
