repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.6.3
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff-format
        types_or: [ python, pyi ]
      - id: ruff
        args: [ --fix ]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        language: system
        # The gate is `pyright crodl/` (see CONTRIBUTING.md). With filenames
        # passed, the hook also checked tests/, whose fakes (FakeApi, a refusing
        # save_update_check) are deliberately not real clients or a repository -
        # and failed on them, a check CI never ran.
        entry: uv run pyright crodl/
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest tests
        pass_filenames: false
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
