
[tool.uv]
package = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[project]
authors = [
    {name = "Oldrich Klimanek", email = "klimanek@scinet.cz"},
]

license = {text = "BSD"}
requires-python = "<4.0,>=3.10"
dependencies = [
    "requests<3.0.0,>=2.31.0",
    "aiohttp<4.0.0,>=3.9.4",
    "beautifulsoup4<5.0.0,>=4.12.3",
    "rich<14.0.0,>=13.8.1",
    "lxml<6.0.0,>=5.3.0",
    "asyncclick<9.0.0.0,>=8.1.7.2",
    "cloudscraper>=1.2.71",
    "anyio>=4.11.0",
    "sqlmodel>=0.0.38",
    "aiosqlite>=0.22.1",
    # Pulled in by SQLAlchemy's async layer (we use it through SQLModel);
    # cro-dl never calls greenlet itself. See WEB_LIBRARY_STACK.md.
    "greenlet>=3.4.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "jinja2>=3.1.6",
    "mutagen>=1.48.1",
]

name = "cro-dl"
dynamic = ["version"]
description = "Enjoy the ČRo offline"
readme = "README.md"

[project.urls]
Repository = "https://github.com/klimanek/cro-dl"
Issues = "https://github.com/klimanek/cro-dl/issues"

[project.scripts]
cro-dl = "crodl.run:run"

[project.optional-dependencies]
# Running the tests from an installed copy, the way the CI does it:
#   pip install "cro-dl[test]"
test = ["pytest<9.0.0,>=8.3.3", "pyyaml>=6.0"]

[dependency-groups]
dev = [    "pre-commit>=4.1.0",
    "pyright>=1.1.394",
    "pytest<9.0.0,>=8.3.3",
    "ruff>=0.9.3",
    "setuptools>=75.8.2",
    "ty>=0.0.84",
    "tzdata>=2025.2",
    "wheel>=0.45.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = []
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["crodl", "crodl.*"]

[tool.setuptools.package-data]
crodl = ["../assets/**/*"]
# The web library is made of these, not only of Python: its pages and the player
# script. 2.0.0 shipped without them, so an installed cro-dl died in StaticFiles
# with "Directory ... does not exist" before it could answer anything.
"crodl.server" = ["static/*", "templates/*"]

[tool.setuptools.dynamic]
version = {attr = "crodl.__version__"}
